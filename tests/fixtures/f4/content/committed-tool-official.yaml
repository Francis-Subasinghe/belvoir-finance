# F4-40 negative fixture: the committed tool flipped to usesOfficialValues: true.
title: Cash-versus-profit explorer
summary: An illustrative tool showing why a profitable month can still drain cash.
assumptions:
  - label: Monthly sales
    default: £20,000
    explanation: The same every month, invoiced from month 1.
  - label: Monthly costs
    default: £15,000
    explanation: The same every month, from month 1.
  - label: Days your customers take to pay
    default: "60"
    explanation: Rounded up to whole months, so 60 days means you are paid two months after the sale.
  - label: Days you take to pay suppliers
    default: "30"
    explanation: Rounded up to whole months, so 30 days means you pay one month after the cost.
  - label: Cash at the start
    default: £10,000
    explanation: In the bank at the start of month 1, with nothing owed before then.
  - label: Time period
    default: 6 months
    explanation: Each month counts as 30 days.
  - label: Payment timing
    default: Whole months
    explanation: A payment lands the number of days divided by 30, rounded up, months later; 0 days is the same month.
  - label: Tax, VAT and interest
    default: None
    explanation: The explorer leaves out tax, VAT, interest, stock and growth.
limitations: Illustrative only. Uses no current tax rates or official values, and shows only the timing gap between profit and cash.
usesOfficialValues: true
demo: true
