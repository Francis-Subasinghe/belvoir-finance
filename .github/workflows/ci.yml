name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# F1-19: read-only default token. Only the codeql job adds security-events: write (needed to upload results).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# F2-38 visual regression is BLOCKING (VISUAL_BLOCKING: "true"; AC_F2 decisions).
# "true" removes continue-on-error from the comparison, so a screenshot diff fails the
# "Visual regression" job, and fails the job when no baselines are committed. "false" is
# report-only. Add "Visual regression" to the required status checks on main.
env:
  VISUAL_BLOCKING: "true"

jobs:
  guards:
    name: Repo guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: "F1-32: no PR-target trigger and no repo secrets in workflows"
        run: |
          if grep -rnE 'pull_request_targe[t]|secrets[.]' .github/workflows; then
            echo "::error::Forbidden trigger or secrets reference found in .github/workflows"
            exit 1
          fi

      - name: "F1-20: every third-party action pinned to a 40-char SHA"
        run: |
          bad=$(grep -rhE '^\s*-?\s*uses:' .github/workflows | grep -vE 'uses:\s*\./' | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unpinned actions:"; echo "$bad"; exit 1
          fi

      - name: "Runner pin: no -latest runner images"
        # Jobs run on a named image (ubuntu-24.04) so a GitHub image switch can't change CI silently.
        # tests/unit/repo-guards.test.ts runs this exact step against fixtures.
        run: |
          if grep -rnE 'runs-on:.*-lates[t]' .github/workflows; then
            echo "::error::Pin runs-on to a named runner image, not -latest"
            exit 1
          fi

      - name: "F1-30: dev and preview servers bind to localhost only"
        # Scans package.json, astro.config.* and everything under scripts/ (Aegis L1).
        # tests/unit/repo-guards.test.ts runs this exact step against fixtures.
        run: |
          targets=$(ls -d package.json astro.config.* scripts 2>/dev/null || true)
          if [ -n "$targets" ] && grep -rnE -- '--host|0\.0\.0\.0|host:\s*true' $targets; then
            echo "::error::A dev or preview server is exposed beyond localhost"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: "F2-38: visual baselines match BASELINES.sha256"
        # Pure Node, no install or network; git-tracked *-linux.png only (tests/unit/visual-baselines.test.ts).
        run: npm run check:visual-baselines

      - name: "Aegis M3: no .mdx under content/"
        run: |
          if [ -d content ] && find content -name '*.mdx' | grep -q .; then
            echo "::error::.mdx files are not allowed under content/"
            find content -name '*.mdx'; exit 1
          fi

  build:
    name: Install, check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Content checks
        run: npm run check:content
      - name: Build (includes dist/ assertions via postbuild)
        run: npm run build
      - name: "Aegis M2: no keystatic route in dist/"
        run: |
          if find dist -ipath '*keystatic*' | grep -q .; then
            echo "::error::keystatic found in dist/"
            find dist -ipath '*keystatic*'; exit 1
          fi
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: "F1-26: Playwright and axe e2e"
        run: npm run test:e2e

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

  visual:
    name: Visual regression
    # F2-38: gallery screenshots at 360, 768 and 1280 px (playwright.visual.config.ts).
    # Baselines come only from this runner image, so font rendering matches.
    # No baselines committed -> generate all three, upload the "visual-baselines" artifact,
    #   then (blocking) fail the job in a separate step that runs after the upload.
    # Baselines committed    -> compare; on a difference (or a missing snapshot), upload
    #   "visual-diff", then regenerate the FULL set (--update-snapshots=all, gallery projects
    #   only) and upload it as "visual-baselines". The job still fails via the compare step.
    # To (re)baseline: review the diff, then follow the step summary, which prints the exact
    # commands: `gh api .../actions/artifacts/<id>/zip` into a `mktemp -d` folder outside the
    # repo, check every zip entry and the unzipped files (no symlinks, nothing unexpected),
    # copy them in, `git add -f`, then `npm run visual:manifest -- --run <run-id> --artifact
    # <artifact-id> --commit <PR head sha>`. Repo guards (check:visual-baselines) checks the
    # hashes, rejects non-*-linux.png files, and requires exactly the set the specs produce.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the gallery (dist-gallery/, never deployed)
        run: npm run build:gallery
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Look for committed baselines
        id: baselines
        run: |
          if [ -d tests/visual/__screenshots__ ] && find tests/visual/__screenshots__ -name '*-linux.png' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Committed baselines:"; find tests/visual/__screenshots__ -name '*-linux.png' | sort
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No committed baselines: this run generates them."
          fi
      - name: Generate baselines (no baselines committed)
        id: generate
        if: steps.baselines.outputs.present == 'false'
        # Only the three gallery projects; the "wireframes" project rewrites docs/design/wireframes/.
        # Writes all three *-linux.png. Never fails for being blocking: that is the step below,
        # after the upload, so the artifact always exists when the job fails for lack of baselines.
        run: |
          npx playwright test --config playwright.visual.config.ts \
            --project visual-360 --project visual-768 --project visual-1280 --update-snapshots=all
      - name: Upload generated baselines
        id: generated-upload
        # Only a complete set: skipped when the generation itself failed.
        if: always() && steps.baselines.outputs.present == 'false' && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/**/*-linux.png
          if-no-files-found: error
          retention-days: 30
      - name: Fail when no baselines are committed (blocking)
        if: always() && steps.baselines.outputs.present == 'false' && env.VISUAL_BLOCKING == 'true'
        run: |
          echo "::error::Visual regression is blocking but no baselines are committed. Commit the visual-baselines artifact (see the job summary)."
          exit 1
      - name: Compare with baselines
        id: compare
        if: steps.baselines.outputs.present == 'true'
        continue-on-error: ${{ env.VISUAL_BLOCKING != 'true' }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          npx playwright test --config playwright.visual.config.ts \
            --project visual-360 --project visual-768 --project visual-1280 --reporter=list,html
      - name: Upload visual diff
        if: always() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Regenerate the full baseline set (compare failed)
        id: regen
        if: always() && steps.compare.outcome == 'failure'
        # Never fails the job by itself; in blocking mode the compare step already did.
        # Clears the folder first so baselines of removed tests are not carried over, then
        # rewrites every snapshot (changed, missing and unchanged) for the three gallery
        # projects only (not "wireframes", which rewrites docs/design/wireframes/).
        continue-on-error: true
        run: |
          rm -rf tests/visual/__screenshots__
          npx playwright test --config playwright.visual.config.ts \
            --project visual-360 --project visual-768 --project visual-1280 --update-snapshots=all
      - name: Upload regenerated baselines
        id: regen-upload
        # Only a complete set: skipped when the regeneration itself failed.
        if: always() && steps.compare.outcome == 'failure' && steps.regen.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/**/*-linux.png
          if-no-files-found: error
          retention-days: 30
      - name: Visual summary
        if: always()
        env:
          PRESENT: ${{ steps.baselines.outputs.present }}
          COMPARE: ${{ steps.compare.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          REGEN: ${{ steps.regen.outcome }}
          ARTIFACT_ID: ${{ steps.regen-upload.outputs.artifact-id || steps.generated-upload.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          # The commit to record: the PR head (what was pushed), or the pushed commit on push.
          # On a pull request the run actually builds GitHub's test merge commit; the run id
          # links the recorded head commit to that build.
          BUILT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mode=$([ "$VISUAL_BLOCKING" = "true" ] && echo blocking || echo report-only)
          {
            echo "## Visual regression (F2-38, $mode)"
            if [ "$PRESENT" = "false" ]; then
              if [ "$GENERATE" = "success" ]; then
                echo "No baselines committed. Generated them on this runner."
              else
                echo "No baselines committed, and generating them failed (\`$GENERATE\`), so no \`visual-baselines\` artifact was uploaded."
              fi
            elif [ "$COMPARE" = "success" ]; then
              echo "All gallery screenshots match the committed baselines."
            else
              echo "Screenshots differ from the baselines, or a snapshot is missing (or the run failed). See the \`visual-diff\` artifact."
              if [ "$REGEN" != "success" ]; then
                echo ""
                echo "Regenerating the full baseline set failed (\`$REGEN\`), so no \`visual-baselines\` artifact was uploaded."
              fi
            fi
            if [ -n "$ARTIFACT_ID" ]; then
              echo ""
              echo "### To accept these screenshots as the new baselines"
              echo "The \`visual-baselines\` artifact (id $ARTIFACT_ID) is the complete set from run $RUN_ID. The commit recorded below, $BUILT_SHA, is the PR head commit (what was pushed; on a push to main, the pushed commit); run $RUN_ID links it to the merge build that rendered the screenshots. Review the screenshots (and the \`visual-diff\`, if any) first, then run this from the repo root. It downloads into a temporary folder outside the repo and checks the zip before anything is copied in (\`gh run download\` can fail with \"path traversal\" on newer gh, and should not extract straight into the checkout):"
              echo ""
              echo '```sh'
              echo "( # in a subshell: any failed check stops the remaining steps"
              echo "set -euo pipefail"
              echo "tmp=\"\$(mktemp -d)\"   # outside the repo"
              echo "gh api repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip > \"\$tmp/a.zip\""
              cat <<'STEPS'
          unzip -tq "$tmp/a.zip"
          # Every zip entry must match the pattern, and none may be a symlink.
          bad="$({ zipinfo -1 "$tmp/a.zip" | grep -Ev '^visual-(360|768|1280)/[a-z0-9-]+-linux\.png$'; zipinfo "$tmp/a.zip" | grep '^l'; } || true)"
          [ -z "$bad" ] || { printf 'STOP: unexpected zip entries:\n%s\n' "$bad"; exit 1; }
          unzip -q "$tmp/a.zip" -d "$tmp/x"
          # After unzip: no symlinks, and nothing but regular files and folders.
          odd="$(find "$tmp/x" -type l; find "$tmp/x" ! -type f ! -type d)"
          [ -z "$odd" ] || { printf 'STOP: unexpected files:\n%s\n' "$odd"; exit 1; }
          git rm -rq --ignore-unmatch tests/visual/__screenshots__ && rm -rf tests/visual/__screenshots__
          mkdir -p tests/visual/__screenshots__ && cp -R "$tmp/x/." tests/visual/__screenshots__/
          git add -f tests/visual/__screenshots__
          STEPS
              echo "npm run visual:manifest -- --run $RUN_ID --artifact $ARTIFACT_ID --commit $BUILT_SHA"
              echo "npm run check:visual-baselines   # hashes, plus exactly the set the visual specs produce"
              echo ")"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
