version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The site runs Node 24 (engines, .nvmrc). @types/node 25+ is for a newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Remove when astro's version satisfies markdoc 2.1 peer range (#35 ERESOLVE)
      - dependency-name: "@astrojs/markdoc"
        versions: [">=2.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL init/analyze/upload-sarif must move together; split PRs fail CI.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
